<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>THE WEIGHT OF BEING HERE</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#111;--line:#343434;--text:#eee;--muted:#999;--accent:#d8d1c8}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#202020 0%,var(--bg) 60%);letter-spacing:.01em}
button{font:inherit;cursor:pointer}
.screen{display:none;min-height:100vh;width:100%;max-width:860px;margin:0 auto;padding:clamp(22px,5vw,54px)}
.screen.active{display:flex;flex-direction:column}
#intro{justify-content:center;align-items:flex-start;min-height:100svh}
.kicker,.tag,.caption,.topline,.note{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(38px,8vw,78px);line-height:.95;letter-spacing:-.055em;margin:22px 0;max-width:720px}
.subtitle{font-size:clamp(16px,2.6vw,20px);line-height:1.7;color:#bcbcbc;max-width:470px}
.figure{height:170px;width:100%;max-width:470px;position:relative;overflow:hidden;margin:22px 0 28px;border-bottom:1px solid #343434;background:linear-gradient(180deg,#111,#080808)}
.window{position:absolute;right:12%;top:15%;height:80px;width:100px;border:1px solid #414141;box-shadow:inset 0 0 25px #222}
.window:before,.window:after{content:"";position:absolute;background:#414141}
.window:before{height:100%;width:1px;left:50%}.window:after{width:100%;height:1px;top:50%}
.person{position:absolute;bottom:0;left:34%;width:58px;height:110px}
.person:before{content:"";position:absolute;width:30px;height:30px;left:14px;top:0;border-radius:50%;background:#777}
.person:after{content:"";position:absolute;width:58px;height:82px;left:0;top:29px;background:linear-gradient(90deg,#292929,#777,#222);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.primary{border:1px solid var(--accent);background:var(--accent);color:#101010;padding:15px 20px;font-size:12px;font-weight:700;letter-spacing:.13em;min-height:48px}
.primary:hover{background:#fff}
.intro-note{margin-top:17px;font-size:10px;letter-spacing:.16em;color:#777}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;font-size:10px;letter-spacing:.14em}
.progress{height:2px;background:#242424;margin:18px 0 30px}.progress span{display:block;height:100%;width:25%;background:var(--accent);transition:width .2s}
.scene-tag{font-size:10px;letter-spacing:.2em;color:#aaa;text-transform:uppercase}
h2{font-size:clamp(30px,6vw,48px);letter-spacing:-.04em;margin:12px 0 20px}
.art{height:clamp(170px,32vw,260px);position:relative;overflow:hidden;background:linear-gradient(180deg,#181818,#080808);border:1px solid #292929;margin-bottom:22px}
.art .window{right:12%;top:14%;height:55%;width:24%}
.art .person{left:42%;transform:scale(1.25);transform-origin:bottom}
.art.dark{background:linear-gradient(180deg,#080808,#000)}
.art.dark .window{border-color:#222;box-shadow:inset 0 0 35px #080808}
.art.dark .person:before{background:#333}.art.dark .person:after{background:#222}
.caption{position:absolute;bottom:12px;left:14px;font-size:9px}
.thought{font-size:15px;line-height:1.9;color:#c9c9c9;max-width:690px}
.thought em{color:#f0ece6}
.prompt{margin:24px 0 13px;font-size:11px;letter-spacing:.15em;color:#aaa;text-transform:uppercase}
.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;display:flex;align-items:center;gap:16px;padding:17px;border:1px solid #393939;background:#101010;color:#eee;line-height:1.5}
.choice:hover,.choice:focus-visible{border-color:#ddd;background:#191919;outline:none}
.choice span{color:#8f8f8f;font-size:9px;letter-spacing:.1em;white-space:nowrap}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.quiet{border:0;background:transparent;color:#999;padding:12px 0;font-size:11px}
.quiet:hover{color:#fff}
footer{margin-top:auto;padding-top:32px;color:#777;font-size:9px;letter-spacing:.17em}
.ending-card{border:1px solid #343434;background:#101010;padding:clamp(22px,5vw,42px);margin-top:18px}
.ending-card p{font-size:15px;line-height:1.9;color:#ccc}
.final-line{font-size:clamp(24px,5vw,38px);line-height:1.3;margin-top:24px}
@media(max-width:520px){.screen{padding:24px 20px}.topbar{font-size:9px}.choice{align-items:flex-start}.choice span{padding-top:4px}.navrow{align-items:center}}
</style>
</head>
<body>
<section id="intro" class="screen active">
  <div class="kicker">An interactive story · Chapter zero</div>
  <h1>THE WEIGHT<br>OF BEING HERE</h1>
  <p class="subtitle">Some rooms are full of people.<br>That doesn't mean you feel less alone.</p>
  <div class="figure" aria-hidden="true"><div class="window"></div><div class="person"></div></div>
  <button class="primary" id="begin" type="button" onclick="startGame()">ENTER THE QUIET</button>
  <div class="intro-note">TAKE YOUR TIME · THERE IS NO SCORE</div>
</section>
<section id="game" class="screen">
  <div class="topbar"><strong>THE WEIGHT OF BEING HERE</strong><span id="chapter">01 / 04</span></div>
  <div class="progress"><span id="progress"></span></div>
  <main id="scene" aria-live="polite"></main>
  <footer>YOU CAN PAUSE HERE AS LONG AS YOU NEED.</footer>
</section>
<script>
(function () {
  "use strict";
  var scenes = [
    {tag:"ROOM 01 · HOME",title:"The bedroom",caption:"22:46 · STILL AWAKE",text:"The room is quiet, but your head isn't. The day keeps replaying itself in pieces: a sentence you wish you'd said differently, a message you checked too many times, a feeling you couldn't explain without making it sound smaller.",thought:"You don't even know what you need. You only know that being asked what is wrong can feel harder than saying nothing.",prompt:"What do you do with the noise?",choices:[["Reach for your phone again.",1],["Put it face down and sit with the silence.",1]]},
    {tag:"ROOM 02 · THE MESSAGE",title:"Unsent",caption:"23:18 · DRAFT SAVED",text:"There is a message you could send. You write it, erase it, and write it again. Every version sounds either too honest or not honest enough. You start trying to guess how it might be read before anyone has even seen it.",thought:"Sometimes the exhausting part isn't what happened. It's rehearsing every possible way it could happen again.",prompt:"What feels closest to the truth?",choices:[["Say what you mean, even if it comes out imperfectly.",2],["Leave the message unsent for tonight.",2]]},
    {tag:"ROOM 03 · THE HOUSE",title:"Not quite alone",caption:"00:07 · VOICES THROUGH THE WALL",text:"You can hear people in the next room. Ordinary conversation, a laugh, the television playing. You are surrounded by signs of life, but still feel a distance you cannot quite explain.",thought:"Being near people and feeling understood are two different things. You can miss one while surrounded by the other.",prompt:"What do you allow yourself to do?",choices:[["Go sit near someone, without explaining everything.",3],["Stay here a little longer and breathe.",3]]},
    {tag:"ROOM 04 · THE MORNING",title:"A little more room",caption:"06:12 · LIGHT AT THE CURTAIN",text:"Morning arrives without answering anything. The messages are still there. So are the questions. But the night has moved on, and for this minute you do not have to solve your entire life.",thought:"You are allowed to be unfinished. You are allowed to need time, and to let someone safe know when things feel heavy.",prompt:"How do you leave this room?",choices:[["Take one small thing at a time.",4],["Ask someone I trust to sit with me.",4]]}
  ];
  var current = 0;
  var answers = [];
  var $ = function (id) { return document.getElementById(id); };
  window.startGame = function () {
    $("intro").classList.remove("active");
    $("game").classList.add("active");
    current = 0;
    answers = [];
    renderScene();
    window.scrollTo(0, 0);
  };
  function renderScene() {
    var s = scenes[current];
    $("chapter").textContent = "0" + (current + 1) + " / 04";
    $("progress").style.width = (((current + 1) / 4) * 100) + "%";
    var choices = s.choices.map(function (choice, i) {
      return '<button type="button" class="choice" data-next="' + choice[1] + '" data-choice="' + i + '"><span>CHOICE 0' + (i + 1) + '</span>' + choice[0] + '</button>';
    }).join("");
    $("scene").innerHTML = '<div class="scene-tag">' + s.tag + '</div><h2>' + s.title + '</h2><div class="art ' + (current === 1 ? 'dark' : '') + '" role="img" aria-label="A quiet monochrome room"><div class="window"></div><div class="person"></div><div class="caption">' + s.caption + '</div></div><p class="thought">' + s.text + '</p><p class="thought"><em>' + s.thought + '</em></p><div class="prompt">' + s.prompt + '</div><div class="choices">' + choices + '</div><div class="navrow">' + (current > 0 ? '<button type="button" class="quiet" id="back">← Previous room</button>' : '<span></span>') + '<button type="button" class="quiet" id="restart">Start over</button></div>';
    Array.prototype.forEach.call(document.querySelectorAll("[data-next]"), function (button) {
      button.addEventListener("click", function () {
        answers[current] = Number(button.getAttribute("data-choice"));
        var next = Number(button.getAttribute("data-next"));
        if (next >= scenes.length) { renderEnding(); return; }
        current = next;
        renderScene();
        window.scrollTo(0, 0);
      });
    });
    if ($("back")) $("back").addEventListener("click", function () { current = Math.max(0, current - 1); renderScene(); window.scrollTo(0, 0); });
    $("restart").addEventListener("click", window.startGame);
  }
  function renderEnding() {
    $("chapter").textContent = "END";
    $("progress").style.width = "100%";
    $("scene").innerHTML = '<div class="scene-tag">END OF CHAPTER</div><h2>Nothing is solved.</h2><div class="art dark" role="img" aria-label="Morning light in a quiet room"><div class="window"></div><div class="person"></div><div class="caption">06:13 · THE DAY CONTINUES</div></div><div class="ending-card"><p>You have reached the end of this little walk. Whatever you chose, there was no perfect answer hidden behind the other option.</p><p>You do not have to explain every feeling perfectly for it to count. And you do not have to carry every difficult thought alone. If things feel heavy, reaching out to someone you trust is a real next step, even when you don't know what to say.</p><div class="final-line">Nothing is resolved.<br>You're still here.</div></div><div class="navrow"><button type="button" class="quiet" id="replay">Walk through it again</button><button type="button" class="primary" id="finish">Leave the room</button></div>';
    $("replay").addEventListener("click", window.startGame);
    $("finish").addEventListener("click", function () { $("game").classList.remove("active"); $("intro").classList.add("active"); window.scrollTo(0, 0); });
    window.scrollTo(0, 0);
  }
  window.addEventListener("error", function () {
    var fallback = document.getElementById("begin");
    if (fallback) fallback.textContent = "RELOAD THE PAGE TO TRY AGAIN";
  });
}());
</script>
</body>
</html>
