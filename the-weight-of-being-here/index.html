<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>THE WEIGHT OF BEING HERE</title>
<style>
:root{color-scheme:dark;--bg:#090909;--paper:#e8e6e0;--ink:#111;--muted:#999;--line:#333;--red:#8b8b8b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#eee;font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.065;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E")}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #eee;outline-offset:4px}.screen{display:none;min-height:100vh}.screen.active{display:flex;animation:fade .7s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#intro{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem;background:radial-gradient(ellipse at 50% 60%,#262626 0,#090909 65%);position:relative}
.kicker{font:10px/1.7 monospace;letter-spacing:.3em;text-transform:uppercase;color:#999}
h1{font:clamp(3rem,11vw,7rem)/.84 Impact,'Arial Narrow',sans-serif;letter-spacing:-.045em;margin:1.5rem 0;text-shadow:3px 3px 0 #333}
.subtitle{max-width:420px;line-height:1.8;color:#b9b9b9;font-style:italic}.figure{width:100px;height:150px;margin:2rem auto 1.3rem;position:relative}.head{position:absolute;top:0;left:35px;width:32px;height:38px;border:2px solid #bdbdbd;border-radius:50%;background:#111}.bodyfigure{position:absolute;top:38px;left:23px;width:55px;height:72px;border:2px solid #aaa;border-bottom:0;border-radius:45% 45% 0 0}.leg{position:absolute;top:104px;left:35px;height:40px;width:2px;background:#aaa;transform:rotate(7deg)}.leg:after{content:"";position:absolute;left:17px;height:39px;width:2px;background:#aaa;transform:rotate(-14deg)}
.primary,.choice,.back{border:1px solid #777;background:#eee;color:#111;padding:.9rem 1.15rem;letter-spacing:.04em;transition:background .2s,transform .2s}.primary:hover,.choice:hover{background:#c9c9c9;transform:translateY(-2px)}.quiet{border:1px solid #444;background:transparent;color:#ccc;padding:.75rem 1rem}.intro-note{margin-top:2.5rem;color:#686868;font:10px monospace;letter-spacing:.12em}
#game{display:none;flex-direction:column;padding:0 0 2rem}#game.active{display:flex}.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid #292929;font:10px monospace;letter-spacing:.15em;color:#888;gap:1rem}.topbar strong{color:#ddd;font-weight:normal}.progress{height:2px;background:#222}.progress span{display:block;height:100%;width:0;background:#bbb;transition:width .5s}
main{width:min(760px,100%);padding:2.2rem 1rem 3rem;margin:auto;flex:1}.scene-tag{font:10px monospace;letter-spacing:.25em;color:#777;text-transform:uppercase;margin-bottom:1rem}.scene-title{font:clamp(2rem,7vw,4rem)/.95 Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0 0 1.5rem}
.art{min-height:245px;position:relative;overflow:hidden;background:#dedcd5;color:#111;border:1px solid #666;display:flex;align-items:center;justify-content:center;padding:1.5rem;margin-bottom:1.5rem;isolation:isolate}.art:after{content:"";position:absolute;inset:0;z-index:-1;opacity:.2;background:radial-gradient(#111 .6px,transparent .8px);background-size:4px 4px}.art.dark{background:#111;color:#eee;border-color:#444}.art .horizon{position:absolute;bottom:0;left:0;right:0;height:35%;background:linear-gradient(transparent,#9997)}.art.dark .horizon{background:linear-gradient(transparent,#333)}.window{position:absolute;right:12%;top:12%;width:30%;height:55%;border:3px solid currentColor;opacity:.7}.window:before,.window:after{content:"";position:absolute;background:currentColor;opacity:.6}.window:before{left:49%;top:0;bottom:0;width:2px}.window:after{top:49%;left:0;right:0;height:2px}.silhouette{position:absolute;bottom:0;left:20%;width:90px;height:150px;opacity:.9}.silhouette:before{content:"";position:absolute;top:0;left:28px;width:35px;height:39px;border:2px solid currentColor;border-radius:50%;background:#111}.silhouette:after{content:"";position:absolute;top:40px;left:12px;width:66px;height:105px;border:2px solid currentColor;border-bottom:0;border-radius:45% 45% 0 0;background:linear-gradient(90deg,transparent 48%,currentColor 49% 51%,transparent 52%)}.art.dark .silhouette:before{background:#111}.room-lines{position:absolute;bottom:0;left:0;right:0;height:28%;border-top:2px solid currentColor;opacity:.25}.caption{font:10px monospace;letter-spacing:.12em;text-transform:uppercase;position:absolute;bottom:1rem;right:1rem;opacity:.6}.thought{font-size:clamp(1.1rem,3.5vw,1.45rem);line-height:1.75;max-width:600px;margin:1rem auto 1.6rem;color:#d0d0d0}.thought em{color:#fff}.prompt{font:11px monospace;letter-spacing:.16em;text-transform:uppercase;color:#888;margin:2rem 0 .8rem}.choices{display:grid;grid-template-columns:1fr;gap:.65rem}.choice{text-align:left;background:#111;color:#ddd;border-color:#444;line-height:1.5}.choice span{display:block;font:9px monospace;letter-spacing:.12em;color:#888;margin-bottom:.25rem}.choice:hover{background:#252525;color:#fff}.navrow{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}.ending-text{max-width:560px;line-height:1.9;color:#bbb;font-size:1.05rem}.ending-text p{margin:1.3rem 0}.final-line{font-size:clamp(1.4rem,4vw,2rem);font-style:italic;color:#eee;margin:3rem 0 2rem;max-width:500px}footer{text-align:center;color:#555;font:9px monospace;letter-spacing:.14em;padding:1.5rem}
@media(min-width:620px){.choices{grid-template-columns:1fr 1fr}.art{min-height:320px}.silhouette{left:27%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section id="intro" class="screen active">
  <div class="kicker">An interactive story · Chapter zero</div>
  <h1>THE WEIGHT<br>OF BEING HERE</h1>
  <p class="subtitle">Some rooms are full of people.<br>That doesn't mean you feel less alone.</p>
  <div class="figure" aria-hidden="true"><div class="head"></div><div class="bodyfigure"></div><div class="leg"></div></div>
  <button class="primary" id="begin">ENTER THE QUIET</button>
  <div class="intro-note">TAKE YOUR TIME · THERE IS NO SCORE</div>
</section>
<section id="game" class="screen">
  <div class="topbar"><strong>THE WEIGHT OF BEING HERE</strong><span id="chapter">01 / 04</span></div>
  <div class="progress"><span id="progress"></span></div>
  <main id="scene" aria-live="polite"></main>
  <footer>YOU CAN PAUSE HERE AS LONG AS YOU NEED.</footer>
</section>
<script>
const scenes = [
 {tag:"ROOM 01 · HOME",title:"The bedroom",dark:false,caption:"22:46 · STILL AWAKE",text:"The room is quiet, but your head isn't. The day keeps replaying itself in pieces: a sentence you wish you'd said differently, a message you checked too many times, a feeling you couldn't explain without making it sound smaller.",thought:"You don't even know what you need. You only know that being asked \"what's wrong?\" can feel harder than saying nothing.",prompt:"What do you do?",choices:[["Stay with the thought","You let the silence stretch. It doesn't solve anything, but for a moment you stop pretending you have an answer.","family"],["Pick up your phone","The screen lights your face. For a second, the glow feels like company.","phone"]]},
 {tag:"ROOM 02 · THE HOUSE",title:"Full house. Empty seat.",dark:false,caption:"VOICES THROUGH THE WALL",text:"From the next room, you hear laughter and overlapping conversations. Someone calls out a question. Someone else answers. The house is alive with little ordinary moments.",thought:"You are part of this family. You know that. Still, some nights you feel like a guest who has stayed too long, sitting close enough to hear everyone and too far away to feel included.",prompt:"How do you respond?",choices:[["Go sit with them","You join the room. You smile at the right moments. Nobody does anything cruel. That almost makes the distance harder to explain.","phone"],["Stay where you are","You tell yourself you prefer the quiet. Maybe you do. Maybe it's easier than trying to explain a loneliness that has no obvious reason.","phone"]]},
 {tag:"ROOM 03 · THE PHONE",title:"Seen at 2:13",dark:true,caption:"NO NEW NOTIFICATIONS",text:"You open a conversation, then close it. Open it again. You wonder if you said too much, too little, or simply mattered less than you thought.",thought:"The hardest part isn't always that someone leaves. Sometimes it's being left with no explanation, so your mind starts writing one for them. You become both the person waiting and the person trying to convince yourself not to wait.",prompt:"What do you choose?",choices:[["Write what you really mean","You type the honest version. You don't send it yet. At least the words exist somewhere outside your head.","ending"],["Put the phone face down","The room gets darker. Nothing is resolved. But for a few seconds, you aren't asking a screen to tell you what you mean to someone.","ending"]]},
 {tag:"ROOM 04 · WHAT REMAINS",title:"Still here",dark:true,caption:"TIME DOES NOT EXPLAIN ITSELF",text:"The house has gone quiet. The phone is still. The same thoughts haven't magically disappeared just because you've reached the end of this little walk.",thought:"Maybe the people around you care and still don't understand. Maybe someone meant well and still hurt you. Maybe you are tired of turning every feeling into a lesson before you're allowed to feel it.",prompt:"There is no correct answer.",choices:[["Keep sitting here","You don't force a conclusion. You let the moment be unfinished.","final"],["Get up, slowly","Not because everything is fine. Only because the next minute is here, and you are too.","final"]]}
];
const state={index:0,history:[]};
const $=id=>document.getElementById(id);
$("begin").addEventListener("click",()=>{ $("intro").classList.remove("active");$("game").classList.add("active");renderScene(0);window.scrollTo(0,0);});
function renderScene(index){
 state.index=index;
 const s=scenes[index];
 $("chapter").textContent=String(index+1).padStart(2,"0")+" / 04";
 $("progress").style.width=((index+1)/4*100)+"%";
 const artClass=s.dark?"art dark":"art";
 const buttons=s.choices.map((c,i)=>'<button class="choice" data-choice="'+i+'"><span>CHOICE 0'+(i+1)+'</span>'+c[0]+'</button>').join("");
 $("scene").innerHTML='<div class="scene-tag">'+s.tag+'</div><h2 class="scene-title">'+s.title+'</h2><div class="'+artClass+'" role="img" aria-label="A quiet room in a monochrome illustration"><div class="window"></div><div class="silhouette"></div><div class="room-lines"></div><div class="horizon"></div><div class="caption">'+s.caption+'</div></div><p class="thought">'+s.text+'</p><p class="thought"><em>'+s.thought+'</em></p><div class="prompt">'+s.prompt+'</div><div class="choices">'+buttons+'</div><div class="navrow">'+(index>0?'<button class="quiet" id="back">← Previous room</button>':'<span></span>')+'<button class="quiet" id="restart">Start over</button></div>';
 document.querySelectorAll("[data-choice]").forEach(btn=>btn.addEventListener("click",()=>choose(Number(btn.dataset.choice))));
 if($("back"))$("back").addEventListener("click",()=>renderScene(index-1));
 $("restart").addEventListener("click",restart);
}
function choose(choice){
 const s=scenes[state.index], selected=s.choices[choice];
 state.history.push({scene:state.index,choice:choice,label:selected[0]});
 if(selected[1]){const old=$("scene").querySelector(".thought");}
 if(selected[2]==="family"){renderScene(1)}
 else if(selected[2]==="phone"){renderScene(2)}
 else if(selected[2]==="ending"){renderScene(3)}
 else {renderEnding(selected[0])}
 window.scrollTo({top:0,behavior:"smooth"});
}
function renderEnding(choice){
 $("chapter").textContent="04 / 04";$("progress").style.width="100%";
 $("scene").innerHTML='<div class="scene-tag">END · NO NEAT CONCLUSION</div><h2 class="scene-title">The room stays quiet.</h2><div class="art dark"><div class="window"></div><div class="silhouette"></div><div class="room-lines"></div><div class="caption">NO ANSWER REQUIRED</div></div><div class="ending-text"><p>You chose to '+choice.toLowerCase()+'.</p><p>Maybe tomorrow, someone will ask how you are and wait long enough to hear the real answer. Maybe they won't. This story can't promise that.</p><p>It can only leave you here for a moment, with the things that are difficult to say and the parts of you that keep showing up anyway.</p></div><div class="final-line">Nothing is resolved.<br>You're still here.</div><div class="navrow"><button class="quiet" id="replay">Walk through it again</button><button class="primary" id="finish">Leave the room</button></div>';
 $("replay").addEventListener("click",restart);$("finish").addEventListener("click",()=>{$("game").classList.remove("active");$("intro").classList.add("active");window.scrollTo(0,0)});
}
function restart(){state.index=0;state.history=[];renderScene(0);window.scrollTo(0,0)}
</script>
</body>
</html>
